# Offline SLA hints. English source text is translated through the existing gettext catalog.
# No links, callbacks or unsupported format promises.

[hint:sla_open_layers]
text = Open SLA layers\nUse Window > Open layer archive to open a supported layer file or a saved layer project. A layer project keeps the layer pixels and captured settings.
enabled_tags = SLA
weight = 1

[hint:sla_edit_result]
text = Edit sliced layers\nAfter slicing a model, use Window > Edit sliced layers to open its pixels. Save a layer project to keep the current layer work.
enabled_tags = SLA
weight = 1

[hint:sla_paint_range]
text = Paint a layer range\nIn the Sliced editor, set First layer and Last layer, then enable Overlay and paint selected range. A brush stroke is applied to that selected range. Undo restores the preceding layer pixels.
enabled_tags = SLA
weight = 1

[hint:sla_brush_palette]
text = Check the brush grayscale\nThe Sliced editor shows the requested and effective brush grayscale. The source mask palette determines the effective value. Changing the export target does not redefine the source palette.
enabled_tags = SLA
weight = 1

[hint:sla_layer_statistics]
text = Show layer statistics\nIn Preview, press L to hide or show the layer statistics panel. Moving the layer slider updates the displayed layer information.
enabled_tags = SLA
weight = 1

[hint:sla_exposure_table]
text = Edit an exposure test table\nWindow > ExposureFinder calibration opens the exposure test form. On Table, use Selected row and Edit selected row to edit values. Normalize rows changes values only after confirmation. Preview plan checks the current draft before Generate.
enabled_tags = SLA
weight = 1

