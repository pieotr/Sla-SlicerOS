# Offline SLA hints. English source text is translated through the existing gettext catalog.
# No links, callbacks or unsupported format promises.

[hint:sla_open_layers]
text = Open SLA layers\nUse Window > Open layer archive to open a supported layer file or a saved layer project. A layer project keeps the layer pixels and captured settings.
enabled_tags = SLA
weight = 1

[hint:sla_edit_result]
text = Edit sliced layers\nAfter slicing a model, use Window > Edit sliced layers to open its pixels. Save a layer project to keep the current layer work.
enabled_tags = SLA
weight = 1

[hint:sla_paint_range]
text = Paint a layer range\nIn the Sliced editor, set First layer and Last layer, then enable Overlay and paint selected range. A brush stroke is applied to that selected range. Undo restores the preceding layer pixels.
enabled_tags = SLA
weight = 1

[hint:sla_brush_palette]
text = Check the brush grayscale\nThe Sliced editor shows the requested and effective brush grayscale. The source mask palette determines the effective value. Changing the export target does not redefine the source palette.
enabled_tags = SLA
weight = 1

[hint:sla_layer_statistics]
text = Show layer statistics\nIn Preview, press L to hide or show the layer statistics panel. Moving the layer slider updates the displayed layer information.
enabled_tags = SLA
weight = 1

[hint:sla_exposure_table]
text = Edit an exposure test table\nWindow > ExposureFinder calibration opens the exposure test form. On Table, use Selected row and Edit selected row to edit values. Normalize rows changes values only after confirmation. Preview plan checks the current draft before Generate.
enabled_tags = SLA
weight = 1

[hint:sla_detect_issues]
text = Find printing problems\nIn the Sliced editor, open the Issues panel and press Detect issues. It looks for islands, overhangs, resin traps, suction cups, touching bounds and empty layers. Detection runs in the background and can be cancelled.
enabled_tags = SLA
weight = 1

[hint:sla_issue_cli]
text = Detect issues without the GUI\nRun sla-slicer --sla-detect-issues file.sl1 --output issues.json to get a JSON list of layer issues for a layer archive or a saved layer project. Use --machine-height to also check the print height.
enabled_tags = SLA
weight = 1

[hint:sla_issue_stale]
text = Issue results can go stale\nAfter you change masks, the Issues panel marks the earlier results as out of date. Press Detect issues again before trusting the list.
enabled_tags = SLA
weight = 1

[hint:sla_undo_redo]
text = Undo every pixel edit\nIn the Sliced editor, each brush stroke and each Apply to range is one step that Undo and Redo can reverse. A cancelled range operation leaves all layers unchanged.
enabled_tags = SLA
weight = 1

[hint:sla_range_filters]
text = Filter a layer range\nRange filters in the Sliced editor offer Threshold, Invert, mirror, Erode, Dilate, Morphological open and close, blur and more. Set First layer and Last layer, choose a filter and press Apply to range.
enabled_tags = SLA
weight = 1

[hint:sla_single_layer]
text = Edit just one layer\nEnable Single layer in the Sliced editor to restrict painting and filters to the layer you are looking at, instead of a First layer to Last layer range.
enabled_tags = SLA
weight = 1

[hint:sla_save_layer_project]
text = Keep your layer edits\nUse Save layer project in the Sliced editor to store the edited layer pixels. A layer project can be reopened later with Window > Open layer archive.
enabled_tags = SLA
weight = 1

[hint:sla_format_per_printer]
text = Remembered export format\nThe export format you choose in the Export sliced layers dialog is remembered separately for each printer profile, so switching printers brings back that printer's usual format.
enabled_tags = SLA
weight = 1

[hint:sla_pcb_exposure]
text = Expose a PCB\nWindow > PCB exposure builds exposure layers from copper Gerber files and an optional Excellon drill file. Several Gerber files can be merged into one exposure.
enabled_tags = SLA
weight = 1

[hint:sla_printer_calibration]
text = Calibrate your printer\nWindow > Printer calibration generates XYZ blocks, grayscale patches, a lift area test, an elephant foot test, a blooming test and a stress tower as ready-to-export layers.
enabled_tags = SLA
weight = 1

[hint:sla_grayscale_steps]
text = Test grayscale response\nIn Printer calibration choose Grayscale patches and set Grayscale steps to see which gray levels your printer cures.
enabled_tags = SLA
weight = 1

[hint:sla_exposure_finder_plan]
text = Plan before you generate\nIn ExposureFinder calibration use Preview plan to check the exposure test before pressing Generate. If you change the table settings, preview the plan again.
enabled_tags = SLA
weight = 1

[hint:sla_open_archive_formats]
text = Open an existing sliced file\nWindow > Open layer archive reads many sliced layer formats and layer images. Only formats with a reader can be opened for editing; other formats can still be exported.
enabled_tags = SLA
weight = 1

[hint:sla_support_points]
text = Edit support points\nUse the SLA Support Points tool on the left toolbar to add, move or remove support points by hand.
enabled_tags = SLA
weight = 1

[hint:sla_hollowing]
text = Hollow and drain your model\nThe Hollow and drill tool on the left toolbar hollows the object and lets you place drain holes, which saves resin.
enabled_tags = SLA
weight = 1
